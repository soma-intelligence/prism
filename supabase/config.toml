# Supabase CLI configuration for the iOS app's own project.
# Hosted project: qnysyehawitnlcnccyop. This is NOT the website's project.
# The local stack (supabase start) reads everything below; the hosted project
# takes its auth settings from the dashboard (see README.md), and only the
# migrations travel with `supabase db push`.

project_id = "qnysyehawitnlcnccyop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# The health-uploads bucket takes objects up to 200 MB.
file_size_limit = "200MiB"

[auth]
enabled = true
# The app signs in natively (Sign in with Apple's identity token), so no web
# redirect is needed for it. These cover an email link or a web flow that
# hands back to the app through its URL scheme.
site_url = "soma://auth-callback"
additional_redirect_urls = ["soma://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

# Sign in with Apple. The app uses the native flow (signInWithIdToken with the
# nonce), which needs the provider enabled and the app's bundle id among the
# client ids; secret is only for the web (Services ID) flow.
# client_id: comma separated, the bundle id first: "Soma.Prism,<services id>".
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.news-ingest]
enabled = true
# The function checks the service role bearer itself (see its README).
verify_jwt = false

[analytics]
enabled = false

[functions.articles-generate]
enabled = true
# Called by pg_cron with the service role bearer, which the function checks itself.
verify_jwt = false

[functions.ask-soma]
enabled = true
# Only a signed in person may ask: the gateway checks their JWT.
verify_jwt = true

[functions.delete-account]
enabled = true
verify_jwt = true
