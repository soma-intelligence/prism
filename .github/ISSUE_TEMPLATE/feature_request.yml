name: Feature request
description: Suggest something Prism should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check ROADMAP.md and the open issues first; it may already be planned. Prism is a wellness app, so ideas that diagnose or treat a condition are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Screens, sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data it needs
      description: Which Apple Health types or other inputs it would read, and whether anything would leave the device.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - iPhone
        - iPad
        - Mac
        - Vision Pro
        - Widgets
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself.
