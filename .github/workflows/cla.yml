name: CLA

# Asks every outside contributor to sign CLA.md once, on their first pull
# request, by replying with the sign phrase. Signatures are committed to
# signatures/version1/cla.json on the cla-signatures branch, so main stays clean.
# That branch must exist before the first pull request (the action writes the
# file but does not create the branch) and must not be protected.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# One run at a time: two signatures landing together would race on the same
# signature file. A queued run waits instead of cancelling the one in progress.
concurrency:
  group: cla
  cancel-in-progress: false

# Security: pull_request_target runs in the context of the base repository with
# a token that can write. That is safe here only because nothing from the pull
# request is checked out or run: the action reads comments and commit authors
# through the GitHub API and writes the signature file. Never add a checkout
# step, a build or a script to this workflow.

# The minimal set the action documents: statuses for the check, pull-requests
# for its comment and the lock after merge, contents for the signature file,
# actions to rerun the check after a signature.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor license agreement
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        # contributor-assistant/github-action v2.6.1, pinned to its commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/soma-intelligence/prism/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          create-file-commit-message: Create the CLA signature file
          signed-commit-message: $contributorName signed the CLA in $owner/$repo
